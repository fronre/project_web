<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Store - إضافة منتجات</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <center>
        <div class="main">
            <form action="#" method="post" enctype="multipart/form-data">
                <h2>Game Store</h2>
                <img src="image/LLL.jpg" alt="logo" width="450px">
                <br><br>
                <input type="text" name="name" placeholder="اسم المنتج" required>
                <br><br>
                <input type="text" name="price" placeholder="سعر المنتج" required>
                <br><br>
                <input type="file" id="file" name="image" style="display:none;">
                <label for="file">اختيار صورة للمنتج</label>
                <br><br>
                <button type="submit">رفع المنتج</button>
                <br><br>
                <a href="products.html">عرض كل المنتجات</a>
            </form>
        </div>
        <p>Developer By Kings</p>
    </center>
</body>
</html>
